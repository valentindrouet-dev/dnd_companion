# Déploie l'application (site statique, sans build) sur GitHub Pages.
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
# Se lance à chaque push sur main, ou manuellement (Actions → Deploy to GitHub Pages → Run workflow)
# depuis n'importe quelle branche pour tester.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Valider les données
        run: npm run validate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
